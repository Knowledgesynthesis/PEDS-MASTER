name: CCHD verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Prepare Chromium smoke tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/peds-smoke" --no-save --package-lock=false playwright@1.58.2
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/peds-smoke/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Test the built app in Chromium
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/peds-preview.log 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              node scripts/cchd-smoke.mjs
              exit
            fi
            sleep 1
          done
          cat /tmp/peds-preview.log
          exit 1

  production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare Chromium smoke tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/peds-smoke" --no-save --package-lock=false playwright@1.58.2
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/peds-smoke/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Verify the deployed calculator at the public Vercel URL
        env:
          CCHD_BASE_URL: https://peds-master.vercel.app/
          CCHD_DEPLOY_ATTEMPTS: '20'
        run: node scripts/cchd-smoke.mjs
